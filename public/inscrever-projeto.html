<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrever Projeto - Comuna Esportes</title>
    <!-- Ícones oficiais -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar Padrão */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background-color: #0b0c10; border-bottom: 1px solid #1e2230; }
        .logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links a:hover { color: #ffffff; }
        .btn-contribua { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); color: #ffffff; padding: 10px 24px; border-radius: 20px; border: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }

        /* Container do Formulário */
        .form-container { max-width: 700px; width: 100%; margin: 50px auto; padding: 0 20px; flex: 1; }
        .form-header { text-align: center; margin-bottom: 35px; }
        .form-header h1 { font-size: 2.3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .form-header p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }

        .project-form { background-color: #12141c; border: 1px solid #1e2230; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; }
        
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; background-color: #1a1d29; border: 1px solid #2d334a; padding: 14px; border-radius: 8px; color: #ffffff; font-size: 0.95rem; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3b82f6; outline: none; }
        
        .btn-submit { background: linear-gradient(45deg, #3b82f6, #a855f7); color: #ffffff; padding: 14px 30px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Comuna Esportes</a>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="quem-somos.html">Quem Somos</a>
            <a href="noticias.html">Notícias</a>
            <a href="contato.html">Contato</a>
            <button class="btn-contribua">Contribua</button>
        </nav>
    </header>

    <div class="form-container">
        <div class="form-header">
            <h1>Inscreva seu Projeto</h1>
            <p>Deixe a sua proposta e traga o racha, quadro ou coletivo cultural da sua quebrada para o mapa oficial do Comuna Esportes.</p>
        </div>

        <form class="project-form" onsubmit="alert('Proposta enviada com sucesso! Nossa equipe entrará em contato para validar o cadastro.'); window.location.href='index.html'; return false;">
            <div class="form-group">
                <label>Nome do Responsável / Organizador</label>
                <input type="text" placeholder="Ex: Carlos Oliveira" required>
            </div>
            <div class="form-group">
                <label>WhatsApp ou E-mail para contato</label>
                <input type="text" placeholder="Ex: (11) 99999-9999 ou email@comunidade.com" required>
            </div>
            <div class="form-group">
                <label>Nome do Projeto, Time ou Crew</label>
                <input type="text" placeholder="Ex: Ritmo e Poesia Crew" required>
            </div>
            <div class="form-group">
                <label>Modalidade Atendida</label>
                <select required>
                    <option value="" disabled selected>Selecione a modalidade</option>
                    <option value="futebol">Futebol da Comunidade</option>
                    <option value="basquete">Basquete de Rua</option>
                    <option value="danca">Dança e Cultura</option>
                    <option value="outros">Outros / Multidisciplinar</option>
                </select>
            </div>
            <div class="form-group">
                <label>Local das Atividades / Ensaios</label>
                <input type="text" placeholder="Ex: Galpão Cultural, Quadra do Bairro, CDC, etc." required>
            </div>
            <div class="form-group">
                <label>Resumo da sua Proposta (Horários, dias e objetivos)</label>
                <textarea rows="4" placeholder="Conte um pouco sobre como funciona o projeto e quem da comunidade pode participar..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Enviar Proposta</button>
        </form>
    </div>

</body>
</html>
